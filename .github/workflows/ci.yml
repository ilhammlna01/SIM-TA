name: CI — Build & Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: development
      PORT: 5001
      ALLOW_TEST_CREDENTIALS: "1"
      JWT_SECRET: "ci-test-jwt-secret-utm-feb-2026-super-long-secure-key"
      # CI memakai secret acak non-produksi agar server boleh start tanpa JWT_SECRET produksi.
      CORS_ORIGIN: http://localhost:5001
      EMAIL_ALLOWED_DOMAINS: trunojoyo.ac.id

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Run full test suite
        run: npm test

      - name: Upload E2E HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: test-results/e2e-report.html
          if-no-files-found: warn
          retention-days: 14
